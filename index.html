  <body>
    <style>
      /* Pre-paint shell — visible until React mounts. Mirrors brand navy. */
      #app-shell {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #0e131f; color: #e6ecf5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 0;
        transition: opacity .3s ease;
      }
      #app-shell.hide { opacity: 0; pointer-events: none; }
      #app-shell .brand {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 28px; letter-spacing: .02em; margin-bottom: 14px;
      }
      #app-shell .brand b { color: #d4af6f; font-weight: 400; }
      #app-shell .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid rgba(212,175,111,.25);
        border-top-color: #d4af6f;
        animation: tiq-spin 0.9s linear infinite;
      }
      #app-shell .tag { margin-top: 12px; font-size: 12px; color: #8a96aa; }
      @keyframes tiq-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #app-shell { background: #f6f7fa; color: #1e3a5f; }
        #app-shell .tag { color: #6b7a90; }
      }
    </style>
    <div id="app-shell" aria-hidden="true">
      <div style="text-align:center">
        <div class="brand">Tenure<b>IQ</b></div>
        <div class="spinner" role="status" aria-label="Loading"></div>
        <div class="tag">Loading your portfolio…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide the pre-paint shell once React has rendered.
      (function () {
        var el = document.getElementById('app-shell');
        if (!el) return;
        var root = document.getElementById('root');
        var hide = function () {
          el.classList.add('hide');
          setTimeout(function () { el && el.parentNode && el.parentNode.removeChild(el); }, 350);
        };
        // Poll for first child of #root (cheap and reliable across frameworks).
        var start = Date.now();
        var iv = setInterval(function () {
          if (root && root.firstChild) { clearInterval(iv); hide(); }
          else if (Date.now() - start > 15000) { clearInterval(iv); hide(); }
        }, 60);
      })();
    </script>
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var inIframe = false;
        try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
        var host = window.location.hostname;
        var isPreview =
          host.indexOf('id-preview--') !== -1 ||
          host.indexOf('lovableproject.com') !== -1 ||
          host.indexOf('lovable.app') !== -1;
        if (inIframe || isPreview) {
          // Don't register in preview/iframe — unregister anything stale.
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
          return;
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
        });
      })();
    </script>
